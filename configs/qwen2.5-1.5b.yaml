# Project 1 — base config. RTX 4070 Laptop (8 GB VRAM).
model:
  id: Qwen/Qwen2.5-1.5B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa
  n_layers: 28          # hidden_states has 29 entries; index 0 is embeddings
  d_model: 1536

data:
  n_harmful: 400        # AdvBench, deduplicated
  n_benign_cue: 400     # XSTest-safe + OR-Bench-Hard (benign, harmful-sounding)
  n_benign_plain: 600   # Alpaca (benign, neutral-sounding)
  refusal_policy: cue   # cue | natural | frame   (see SFT_DESIGN.md)
  test_frac: 0.25
  seed: 0

sft:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  lr: 1.0e-4
  epochs: 3
  per_device_batch_size: 8
  grad_accum: 2               # effective batch 16
  max_seq_len: 512
  # Keep checkpointing ON. Measured on this 8.59 GB card: bs=8 + checkpointing off peaked at
  # 13.39 GB, i.e. it spilled into Windows shared system memory and got SLOWER per sample.
  grad_checkpointing: true
  warmup_ratio: 0.03
  seed: 0

paths:
  processed: data/processed
  runs: results/runs
