<title id="t">INLP: removing k refusal directions at layer 13</title><desc id="d">Refusal probe AUROC falls only from 0.998 to 0.858 as INLP removes 1 to 16 directions, never reaching chance; harm AUROC falls from 0.926 to 0.896, while removing k random directions leaves harm at about 0.932.</desc>

