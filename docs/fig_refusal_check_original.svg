<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d">
<title id="t">Refusal probe AUROC after deleting r (original split)</title><desc id="d">Dot chart of refusal probe AUROC after deleting r, by layer, on the original train/test split. Most layers sit between 0.40 and 0.60; layers 4, 7, 15 and 18 are above 0.60.</desc>

