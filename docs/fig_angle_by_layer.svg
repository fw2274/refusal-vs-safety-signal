<title id="t">Angle between the refusal direction r and the harm direction d</title><desc id="d">Line chart of the r-d angle by layer: near 90 degrees in layers 1-8, falling from about 85 to 34 degrees between layers 9 and 17, then levelling off near 30 degrees.</desc>

